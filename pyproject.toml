[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="ot-irregularity"
version="0.1.0"
license="Apache-2.0"
license-files=["LICENSE"]
requires-python=">=3.12"
dependencies=["numpy>=2.0","polars>=1.0","pyarrow>=17","scikit-learn>=1.5","torch>=2.4","joblib>=1.4","pydantic>=2.8","PyYAML>=6","matplotlib>=3.9"]
[project.optional-dependencies]
test=["pytest>=8.3"]
[project.scripts]
ot-irregularity="ot_irregularity.cli:main"
[tool.hatch.build.targets.wheel]
packages=["src/ot_irregularity"]
[tool.pytest.ini_options]
pythonpath=["src", "."]
