name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen --extra test --python 3.12
      - name: Record environment
        run: uv run --frozen python -c "import sys, torch, polars, sklearn; print(sys.version); print('torch', torch.__version__, 'polars', polars.__version__, 'sklearn', sklearn.__version__); assert not torch.cuda.is_available()"
      - name: Tests including synthetic train-save-load-infer
        run: uv run --frozen pytest -q
      - name: Check whitespace
        run: git show --format= --check HEAD
